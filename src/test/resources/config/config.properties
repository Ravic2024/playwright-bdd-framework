# ==========================================================
#  Framework configuration
#  Any key can be overridden at runtime:  mvn test -Dbrowser=firefox -Dheadless=false
# ==========================================================

# Application
base.url=https://www.saucedemo.com/

# Browser: chromium | firefox | webkit | chrome | msedge
browser=chromium
headless=true
slow.mo=0
viewport.width=1366
viewport.height=768

# Timeouts (milliseconds)
default.timeout=30000
navigation.timeout=45000

# Failure evidence
screenshot.dir=test-output/screenshots
video.enabled=true
video.temp.dir=test-output/videos/temp
video.dir=test-output/videos/failed

# Test data
excel.path=src/test/resources/testdata/TestData.xlsx
